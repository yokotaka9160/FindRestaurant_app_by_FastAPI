# 開発用（ホットリロード）：
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   フロント http://localhost:5173 / API http://localhost:8000/docs
services:
  backend:
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: .
      target: dev
    ports: !override
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8000
    volumes:
      - .:/app
      - /app/node_modules   # コンテナ内の node_modules を保持
