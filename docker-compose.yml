# 本番相当：  docker compose up --build
#   フロント http://localhost:8080 / API http://localhost:8000/docs
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/shops')"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      target: prod
      args:
        # ブラウザ（ホスト側）から見た API の URL
        VITE_API_BASE: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
