# 本番相当：  docker compose up --build
#   フロント http://localhost:8080 / API http://localhost:8000/docs
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # ルートの .env に YELP_API_KEY=... を書くと Yelp Fusion API を使う（未設定ならモックデータ）
      YELP_API_KEY: ${YELP_API_KEY:-}
      # ルート検索（OSRM）。未設定なら公開デモサーバー（車ルート・低頻度の利用のみ）
      OSRM_URL: ${OSRM_URL:-}
      OSRM_PROFILE: ${OSRM_PROFILE:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      target: prod
      args:
        # ブラウザ（ホスト側）から見た API の URL
        VITE_API_BASE: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
